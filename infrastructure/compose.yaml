services:
  postgres:
    image: postgres:17-alpine
    container_name: vernora-postgres
    environment:
      POSTGRES_DB: vernora
      POSTGRES_USER: vernora
      POSTGRES_PASSWORD: vernora
    ports:
      # Host port 5433 because 5432 is commonly taken by other local projects;
      # inside the container Postgres still listens on its default 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vernora -d vernora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
